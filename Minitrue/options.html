<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Minitrue</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      border: 2px solid #111;
      background: #fff;
      padding: 18px 18px 14px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    p {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.4;
      color: #222;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 2px solid #111;
      background: #fff;
      color: #111;
      padding: 10px 12px;
      font: 14px/1.4 Arial, sans-serif;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 2px solid #111;
      background: #fff;
      color: #111;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .danger {
      background: #d71920;
      color: #fff;
      border-color: #d71920;
    }

    #status {
      min-height: 18px;
      margin-top: 12px;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Minitrue</h1>
    <p>Blocked usernames, one per line.</p>

    <textarea id="list" placeholder="username"></textarea>

    <div class="actions">
      <button id="save">Save</button>
      <button id="clear">Clear list</button>
      <button id="fetch" class="danger">Fetch latest list</button>
    </div>

    <p id="status"></p>
  </div>

  <script src="scripts/main.js"></script>
  <script src="options.js"></script>
</body>
</html>
